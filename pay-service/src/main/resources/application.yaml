server:
  port: 8086
spring:
  application:
    name: pay-service
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${hm.db.host}:${hm.db.port}/hmall?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw}
  cloud:
    nacos:
      server-addr: localhost:8848
    sentinel:
      transport:
        dashboard: localhost:8090 # Sentinel 控制台地址
      http-method-specify: true # 簇点资源名带上请求方式前缀，如 POST:/pay-orders
      log:
        dir: logs/sentinel # 默认写在用户目录下，容易出现 AccessDeniedException，这里指到项目目录
  rabbitmq:
    host: localhost
    port: 5672
    virtual-host: /hmall
    username: hmall
    password: 123
feign:
  sentinel:
    enabled: true # 开启 Feign 对 Sentinel 的支持，FeignClient 会变成簇点资源
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.hmall: debug
    com.hmall.api.client: DEBUG
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 支付服务接口文档
    description: "支付服务接口文档"
    email: zhanghuyi@itcast.cn
    concat: 虎哥
    url: https://www.itcast.cn
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.hmall.pay.controller
